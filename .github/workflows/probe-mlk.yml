name: Probe MLK page (temporary)

on:
  push:
    branches: [claude/mlk-multiple-pdfs-471q4k]
    paths: [.github/workflows/probe-mlk.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump document links and PDF headers
        run: |
          sudo apt-get install -y poppler-utils >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for page in Martin-Luther-King-Jr-Pool-216 North-Beach-Pool-218 Balboa-Pool-212 Coffman-Pool-213 Garfield-Pool-214 Hamilton-Pool-215 Mission-Community-Pool-217 Rossi-Pool-219; do
            echo "===== $page"
            curl -sSL -A "$UA" "https://sfrecpark.org/Facilities/Facility/Details/$page" -o page.html
            grep -o '<a[^>]*DocumentCenter/View/[^>]*>[^<]*</a>' page.html
            echo "--- documents row"
            tr '\n' ' ' < page.html | grep -o '<th[^>]*>[[:space:]]*Documents[[:space:]]*</th>.\{0,1500\}' | head -c 1500; echo
          done
          echo "===== MLK pdfs"
          curl -sSL -A "$UA" "https://sfrecpark.org/Facilities/Facility/Details/Martin-Luther-King-Jr-Pool-216" -o mlk.html
          for id in $(grep -o 'DocumentCenter/View/[0-9]*' mlk.html | sort -u | grep -o '[0-9]*$'); do
            echo "##### View/$id"
            curl -sSL -A "$UA" -D hdr.txt "https://sfrecpark.org/DocumentCenter/View/$id" -o doc.pdf
            grep -i 'content-disposition\|last-modified' hdr.txt
            pdftotext -layout doc.pdf - 2>/dev/null | head -40
          done
