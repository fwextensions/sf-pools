name: TEMP dump PDF text
on:
  push:
    branches: [claude/holiday-closures-4ko8ub]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Dump
        run: |
          mkdir -p /tmp/pdfs
          for id in $(jq -r 'to_entries[] | "\(.key)=\(.value.pdfUrl)"' data/pdf-manifest.json); do
            name=${id%%=*}; url=${id#*=}
            curl -sSL -A "Mozilla/5.0" -o /tmp/pdfs/$name.pdf "$url"
            echo "===== $name $url"
            npx tsx -e "import {readPdfLines} from './scripts/read-pdf-lines'; import fs from 'fs'; const ls=readPdfLines(fs.readFileSync('/tmp/pdfs/$name.pdf')); ls.sort((a,b)=>a.page-b.page||Math.round(a.y)-Math.round(b.y)||a.x-b.x); let k=''; let row=[]; for (const l of ls){const kk=l.page+':'+Math.round(l.y/3); if(kk!==k&&row.length){console.log(row.join(' | ')); row=[];} k=kk; row.push(l.text.trim());} console.log(row.join(' | '))"
          done
