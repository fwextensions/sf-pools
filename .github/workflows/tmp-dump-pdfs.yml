name: TEMP dry-run pipeline
on:
  push:
    branches: [claude/holiday-closures-4ko8ub]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      # the pipeline without --notify and without committing anything
      - name: Pipeline
        run: npm run scrape && npm run download-pdfs && npm run scrape-alerts && npm run process-all-pdfs
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
      - name: Closures
        if: always()
        run: |
          jq -c '.[] | {id, closure: (.closure.summary // null), scheduledClosures}' public/data/all_schedules.json
          git diff --stat
