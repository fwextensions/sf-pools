name: TEMP dump PDF text
on:
  push:
    branches: [claude/holiday-closures-4ko8ub]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - name: Dump
        run: |
          mkdir -p /tmp/pdfs
          for id in $(jq -r 'to_entries[] | "\(.key)=\(.value.pdfUrl)"' data/pdf-manifest.json); do
            name=${id%%=*}; url=${id#*=}
            curl -sSL -A "Mozilla/5.0" -o /tmp/pdfs/$name.pdf "$url"
            echo "===== $name $url"
            pdftotext -layout /tmp/pdfs/$name.pdf - | sed 's/  */ /g' | grep -v '^ *$'
            echo "----- pdf-inspector lines"
            npx tsx -e "import {readPdfLines} from './scripts/read-pdf-lines'; import fs from 'fs'; const ls=readPdfLines(fs.readFileSync('/tmp/pdfs/$name.pdf')); for (const l of ls) if (/clos|holiday|day|[0-9]+\/[0-9]+/i.test(l.text)) console.log(l.page, Math.round(l.x), Math.round(l.y), l.text)"
          done
