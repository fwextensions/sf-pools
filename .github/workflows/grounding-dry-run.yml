# temporary (gemini-3.6-flash, gemini-3.7-flash): runs the extraction with
# grounding on this branch and commits only its logs and extracts; no
# notifications, no data published
name: Grounding dry run
on:
  push:
    branches: [claude/project-thread-9xaplz]
    paths: [.github/workflows/grounding-dry-run.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run scrape && npm run download-pdfs
      - name: Extract with each model
        run: |
          for model in gemini-3.7-flash gemini-3.6-flash; do
            mkdir -p grounding-run/$model
            git checkout -- public/data data/extracted
            EXTRACT_MODEL=$model REFRESH_EXTRACT=1 npx tsx scripts/process-all-pdfs.ts > grounding-run/$model/log.txt 2>&1 || echo "exit $?" >> grounding-run/$model/log.txt
            cp -r data/extracted grounding-run/$model/extracted
            cp public/data/all_schedules.json grounding-run/$model/
          done
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grounding-run
          git commit -m "Grounding dry run output"
          git push
