# temporary: runs the extraction with grounding once on this branch and
# commits only its log and extracts; no notifications, no data published
name: Grounding dry run
on:
  push:
    branches: [claude/project-thread-9xaplz]
    paths: [.github/workflows/grounding-dry-run.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run scrape && npm run download-pdfs
      - name: Extract with grounding
        run: |
          mkdir -p grounding-run
          npx tsx scripts/process-all-pdfs.ts > grounding-run/log.txt 2>&1 || echo "exit $?" >> grounding-run/log.txt
          cp -r data/extracted grounding-run/extracted
          cp public/data/all_schedules.json grounding-run/
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grounding-run
          git commit -m "Grounding dry run output"
          git push
