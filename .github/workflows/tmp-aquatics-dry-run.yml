name: TEMP aquatics docs dry run
on:
  push:
    branches: [claude/project-thread-6il7om]
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx tsx scripts/scrape-aquatics-docs.ts --dry-run --force
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
      - run: tail -2 data/usage/llm-usage.jsonl
