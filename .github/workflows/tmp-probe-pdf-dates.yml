name: TEMP probe PDF dates (do not merge)

on:
  push:
    branches: [claude/project-thread-g93a6f]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        run: |
          sudo apt-get install -y poppler-utils >/dev/null 2>&1 || true
          mkdir -p probe pdfs
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          IDS="15972 19018 26439 26440 26441 26442 26443 26444 26445 26455 26525 27955 28024 28025 28026 28027 28028 28029 28030 28113 28115 28140 28172 28495 28496 28498 28501 28503 28547 28553 28771 28927 28959 29110 29562 29563 29564 29566 29568 29569 29570 29571 29578 29599 29796 29798 29799 29800 29802 29804 29805 29808 29953 29954 30001 30037 30210 30319"
          for id in $IDS; do
            {
              echo "=== $id"
              curl -sSL -A "$UA" -D - -o pdfs/$id.pdf "https://sfrecpark.org/DocumentCenter/View/$id" | grep -iE '^(HTTP|last-modified|content-disposition|content-type|date):' | tr -d '\r'
              pdfinfo pdfs/$id.pdf 2>/dev/null | grep -E '^(Title|Author|Creator|Producer|CreationDate|ModDate):'
              echo "-- text:"; pdftotext -l 1 pdfs/$id.pdf - 2>/dev/null | tr -s '\n ' ' ' | head -c 300; echo
              echo "-- wayback first:"; curl -sS -m 30 "https://web.archive.org/cdx/search/cdx?url=sfrecpark.org/DocumentCenter/View/$id&limit=3&fl=timestamp,statuscode" || true
            } >> probe/pdfs.txt 2>&1
          done
          for page in Balboa-Pool-212 Coffman-Pool-213 Garfield-Pool-214 Hamilton-Pool-215 Martin-Luther-King-Jr-Pool-216 Mission-Community-Pool-217 North-Beach-Pool-218 Rossi-Pool-219 Sava-Pool-220; do
            {
              echo "=== $page"
              curl -sSL -A "$UA" "https://sfrecpark.org/Facilities/Facility/Details/$page" | grep -oE '<a[^>]*DocumentCenter/View/[0-9]+[^>]*>[^<]*</a>' | sed -E 's/<a[^>]*View\/([0-9]+)[^>]*>([^<]*)<\/a>/\1 | \2/'
              echo "-- wayback captures (collapsed by day):"
              curl -sS -m 60 "https://web.archive.org/cdx/search/cdx?url=sfrecpark.org/Facilities/Facility/Details/$page&from=2025&fl=timestamp,digest&collapse=digest" || true
            } >> probe/pages.txt 2>&1
          done
          cat probe/pdfs.txt probe/pages.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "TEMP probe results" && git push
